services:
  - type: web
    name: mymarket-ug
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mymarket-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@mymarket.ug
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_DOMAIN
        value: mymarket.ug
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: mymarket-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: mymarket-db
    plan: free
