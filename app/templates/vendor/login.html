{% extends "base.html" %}
{% block title %}Vendor Login — MyMarket.ug{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-extrabold text-brand-700 mb-4">Vendor Login</h1>
  <form method="post" class="space-y-3 bg-white border rounded-2xl p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg px-3 py-2">
    <input name="password" type="password" required placeholder="Password" class="w-full border rounded-lg px-3 py-2">
    <button class="w-full bg-brand-600 text-white font-bold rounded-xl py-3">Login</button>
  </form>
  <p class="text-sm text-center mt-3">New here? <a href="/vendor/signup" class="text-brand-700 font-semibold">Apply to be a Vendor</a></p>
</div>
{% endblock %}
