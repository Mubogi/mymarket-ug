{% extends "base.html" %}
{% block title %}Edit {{ p.name }} — MyMarket.ug{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-xl font-extrabold text-brand-700 mb-3">Edit Product</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-3 bg-white border rounded-2xl p-4">
    <div class="aspect-square w-32 bg-brand-50 rounded-xl overflow-hidden grid place-items-center">
      {% if p.image_url %}<img src="{{ p.image_url }}" class="object-cover w-full h-full">{% else %}🛍️{% endif %}
    </div>
    <input name="name" required value="{{ p.name }}" class="w-full border rounded-lg px-3 py-2">
    <input name="price" required type="number" min="0" value="{{ p.price }}" class="w-full border rounded-lg px-3 py-2">
    <select name="category" class="w-full border rounded-lg px-3 py-2">
      {% for c in categories %}<option {{ 'selected' if c == p.category }}>{{ c }}</option>{% endfor %}
    </select>
    <textarea name="description" rows="3" class="w-full border rounded-lg px-3 py-2">{{ p.description }}</textarea>
    <label class="block text-sm text-gray-600">Replace image
      <input type="file" name="image" accept="image/*" class="w-full text-sm mt-1">
    </label>
    <input name="image_url" value="{{ p.image_url if p.image_url and p.image_url.startswith('http') else '' }}" placeholder="...or paste image URL" class="w-full border rounded-lg px-3 py-2">
    <button class="w-full bg-brand-600 text-white font-bold rounded-xl py-3">Save Changes</button>
    <a href="/vendor?tab=products" class="block text-center text-sm text-gray-500">Cancel</a>
  </form>
</div>
{% endblock %}
