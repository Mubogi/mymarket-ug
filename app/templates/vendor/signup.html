{% extends "base.html" %}
{% block title %}Apply to be a Vendor — MyMarket.ug{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-extrabold text-brand-700 mb-1">Apply to be a Vendor</h1>
  <p class="text-sm text-gray-600 mb-4">One-time setup fee: <b>UGX 10,000</b>. Get your shop at <b>yourname.mymarket.ug</b> + 10 free products.</p>
  <form method="post" enctype="multipart/form-data" class="space-y-3 bg-white border rounded-2xl p-4">
    <input name="name" required placeholder="Your full name" class="w-full border rounded-lg px-3 py-2">
    <input name="phone" required placeholder="Phone (WhatsApp) e.g. 0772 123456" class="w-full border rounded-lg px-3 py-2">
    <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg px-3 py-2">
    <input name="password" type="password" required minlength="6" placeholder="Password" class="w-full border rounded-lg px-3 py-2">
    <hr>
    <input name="shop_name" required placeholder="Shop name e.g. John Shoes" class="w-full border rounded-lg px-3 py-2">
    <select name="location_city" class="w-full border rounded-lg px-3 py-2">
      {% for c in cities %}<option>{{ c }}</option>{% endfor %}
    </select>
    <input name="location_detail" placeholder="Location detail e.g. Nakasero Market, Stall 23" class="w-full border rounded-lg px-3 py-2">
    <textarea name="description" placeholder="Describe your shop" class="w-full border rounded-lg px-3 py-2" rows="2"></textarea>
    <label class="block text-sm text-gray-600">Shop logo (optional)
      <input type="file" name="logo" accept="image/*" class="w-full text-sm mt-1">
    </label>
    <button class="w-full bg-brand-600 text-white font-bold rounded-xl py-3">Submit Application</button>
  </form>
  <p class="text-sm text-center mt-3">Already have a shop? <a href="/vendor/login" class="text-brand-700 font-semibold">Login</a></p>
</div>
{% endblock %}
