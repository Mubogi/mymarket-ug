{% extends "base.html" %}
{% block title %}{{ code }} — MyMarket.ug{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <img src="/static/logo.svg" alt="MyMarket.ug" class="w-16 h-16 mx-auto mb-4">
  <h1 class="text-5xl font-extrabold text-brand-700">{{ code }}</h1>
  <p class="text-gray-600 mt-2">{{ message }}</p>
  <a href="/" class="inline-block mt-6 px-5 py-2.5 rounded-full bg-brand-600 text-white font-bold">← Back to the market</a>
</div>
{% endblock %}
