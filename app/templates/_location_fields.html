{# Cascading Uganda location picker: district → area → building/landmark → shop no #}
<script src="/static/js/uganda-locations.js"></script>
<div x-data="{
    district: '{{ v.location_city if v else 'Kampala' }}',
    area: '{{ v.location_area if v else '' }}',
    areas: [],
    updateAreas() { this.areas = window.UGANDA_LOCATIONS[this.district] || ['Other']; if (!this.areas.includes(this.area)) this.area = ''; }
  }" x-init="updateAreas()" class="space-y-3">
  <div>
    <label class="text-xs text-gray-500 font-semibold">District</label>
    <select name="location_city" x-model="district" @change="updateAreas()" class="w-full border rounded-lg px-3 py-2">
      <template x-for="d in Object.keys(window.UGANDA_LOCATIONS)" :key="d">
        <option :value="d" :selected="d === district" x-text="d"></option>
      </template>
    </select>
  </div>
  <div>
    <label class="text-xs text-gray-500 font-semibold">Area / Division / Ward</label>
    <select name="location_area" x-model="area" class="w-full border rounded-lg px-3 py-2">
      <option value="">— Select area —</option>
      <template x-for="a in areas" :key="a">
        <option :value="a" :selected="a === area" x-text="a"></option>
      </template>
    </select>
  </div>
  <div>
    <label class="text-xs text-gray-500 font-semibold">Building / Market / Landmark nearby</label>
    <input name="location_detail" value="{{ v.location_detail if v else '' }}" placeholder="e.g. Nakasero Market, near Total fuel station" class="w-full border rounded-lg px-3 py-2">
  </div>
  <div>
    <label class="text-xs text-gray-500 font-semibold">Shop / Stall No.</label>
    <input name="shop_no" value="{{ v.shop_no if v else '' }}" placeholder="e.g. Stall 23" class="w-full border rounded-lg px-3 py-2">
  </div>
</div>
